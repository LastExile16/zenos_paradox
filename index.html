<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Zeno — An Interactive Journey into Infinity</title>
    <meta
      name="description"
      content="Narrow the gap between two fingertips and travel from the human hand to the atom."
    />
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <p id="scale-indicator" aria-live="polite">10 mm</p>
        <h1 id="milestone">Hand</h1>
        <p id="counter" aria-hidden="true">n = 0</p>
        <div id="controls">
          <button id="double" type="button" aria-label="Double the gap">Double</button>
          <button id="halve" type="button" aria-label="Halve the gap">Halve</button>
          <button id="reset" type="button" aria-label="Reset the gap">Reset</button>
        </div>
        <p id="hint">Halve: ↓ / ← · Double: ↑ / → · Reset: R</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
